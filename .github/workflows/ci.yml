name: CI

# The two `paths` lists below are deliberately identical, and deliberately written
# out twice. A filter applied to pull_request but not to the push onto main (or the
# reverse) would gate a commit on one leg and not the other, which is worse than no
# filter at all. A YAML anchor would express that intent once, but GitHub Actions
# does not support anchors, and PyYAML does: the guard test would resolve the alias
# and pass while GitHub rejected the workflow. So: duplicated here, and
# tests/test_ci_paths_filter.py asserts the two lists stay in step and that nothing
# the suite actually reads is excluded. `workflow_dispatch` stays unfiltered as the
# escape hatch, forcing the full matrix on any ref whatever changed.
on:
  push:
    branches: [main]
    paths:
      # Run by default. Anything not excluded below starts a run, so a new kind
      # of file fails safe rather than silently skipping the gate.
      - "**"
      # Prose. Nothing in the suite, the wheel build or the installer reads it,
      # and a documentation commit queued ten jobs including three installer
      # containers it could not affect.
      - "!**.md"
      - "!docs/**"
      - "!tasks/**"
      - "!LICENSE"
      - "!NOTICE"
      # Except the reference docs that are executable in practice. The three CEF
      # references are the golden-line oracle that tests/test_*_golden.py parse,
      # and tests/test_web_docs.py asserts all five exist on disk, so editing one
      # can fail the suite. Later patterns win, which is what re-includes these.
      - "docs/fortigate-cef-reference.md"
      - "docs/paloalto-cef-reference.md"
      - "docs/checkpoint-cef-reference.md"
      - "docs/technique-catalog-expansion-research.md"
      - "docs/technique-catalog-expansion-research-round2.md"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!tasks/**"
      - "!LICENSE"
      - "!NOTICE"
      - "docs/fortigate-cef-reference.md"
      - "docs/paloalto-cef-reference.md"
      - "docs/checkpoint-cef-reference.md"
      - "docs/technique-catalog-expansion-research.md"
      - "docs/technique-catalog-expansion-research-round2.md"
  workflow_dispatch:

# A second push to the same branch cancels the first: these jobs spend real
# minutes in containers and nobody needs results for a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action majors are pinned to the current ones, all of which declare
# `using: node24` in their own action.yml. The floor is lower (checkout v5,
# setup-python v6, setup-node v5 are the first Node 24 majors) but pinning at the
# floor would leave two majors of drift to redo. Node 20 is deprecated on the
# runners and these were already being forced onto Node 24, which is what the
# deprecation warnings on every job were reporting.
#
# All three need runner v2.327.1 or newer. `runs-on: ubuntu-latest` is
# GitHub-hosted, so that is satisfied; a self-hosted runner would need checking.

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject (requires-python = ">=3.11").
        # Testing it is what keeps that claim honest rather than aspirational.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest

      - name: black
        run: black --check replicant tests

      - name: ruff
        run: ruff check replicant tests

      - name: mypy
        run: mypy replicant

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the installer enforces, and the lowest Node that vite 8
        # and vitest 4 support. 22 is the current LTS.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: npm ci
        working-directory: webui
        run: npm ci

      - name: vitest
        working-directory: webui
        run: npm test

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Assert the build actually produced a page
        working-directory: webui
        # Vite builds into the Python package so the UI ships in a wheel.
        run: test -f ../replicant/webui_dist/index.html

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, and run through the same image a developer can run locally.
      # The runner image's preinstalled shellcheck is a different build from the
      # one on the development machine, and the two disagreed on SC2015: CI
      # failed on a line that passed locally. Pinning makes "shellcheck clean"
      # mean the same thing in both places.
      #
      # Reproduce locally with exactly this command.
      - name: shellcheck (pinned)
        run: |
          docker run --rm -v "$PWD":/mnt:ro koalaman/shellcheck:v0.11.0 --version
          docker run --rm -v "$PWD":/mnt:ro koalaman/shellcheck:v0.11.0 \
            /mnt/scripts/install.sh /mnt/scripts/verify-systemd-unit.sh

      - name: bash -n
        run: |
          bash -n scripts/install.sh
          bash -n scripts/verify-systemd-unit.sh

  installer:
    name: Installer on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ships Node 18, which the Node 20 floor (vite 8, vitest 4) no longer
          # accepts, so the frontend cannot be built from its own repositories.
          # The CLI path is still the supported one here and is what this proves.
          - image: debian:12
            flags: "--yes --no-web"
            expect_exit: 0
          # Ships Python 3.13 and Node 20, so it satisfies both minimums
          # natively. This is the full install including the frontend, the case
          # debian:12 covered until the Node floor moved.
          - image: debian:13
            flags: "--yes"
            expect_exit: 0
          # Ships Python 3.9 and Node 16. Python resolves to a versioned package,
          # Node does not, so --no-web is the supported path here.
          - image: rockylinux:9
            flags: "--yes --no-web"
            expect_exit: 0
          # Ships Python 3.10, and offers python3.11 only as 3.11.0~rc1. The
          # correct behaviour is refusal WITHOUT touching the system. This case
          # is the regression guard for DEF-004: before the fix it installed
          # packages and only then died with "still missing after install".
          - image: ubuntu:22.04
            flags: "--yes"
            expect_exit: 3
            expect_no_mutation: true
    steps:
      - uses: actions/checkout@v7

      - name: Run the installer in ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Copy rather than bind-mount: the installer writes .venv, node_modules
          # and manifests/ into the repo root, and a read-only mount would fail
          # while a writable one would leave Linux build artefacts in the workspace.
          #
          # Script is fed on stdin via a QUOTED heredoc so the outer runner shell
          # expands nothing. Everything below reaches the container verbatim,
          # which is what lets dpkg-query's ${binary:Package} format string
          # survive: unquoted, the container's bash would read it as a substring
          # expansion with a non-numeric offset and abort.
          # GitHub still substitutes its own matrix expressions first, since that
          # happens on the YAML before any shell sees it.
          docker run --rm -i -v "$PWD":/src:ro "${{ matrix.image }}" bash -s <<'CONTAINER' | tee /tmp/installer.log
          set -uo pipefail
          mkdir -p /repo
          tar -C /src -cf - --exclude=./.venv --exclude=node_modules --exclude=./.git . 2>/dev/null \
            | tar -C /repo -xf - 2>/dev/null

          count_packages() {
            if command -v dpkg-query >/dev/null 2>&1; then
              dpkg-query -f '.\n' -W 2>/dev/null | wc -l
            else
              rpm -qa 2>/dev/null | wc -l
            fi
          }
          count_desktop_packages() {
            if command -v dpkg-query >/dev/null 2>&1; then
              dpkg-query -f '${binary:Package}\n' -W 2>/dev/null \
                | grep -cE '^(tilix|libgtk-3-0|ubuntu-mono|humanity-icon-theme)$'
            else
              echo 0
            fi
          }

          BEFORE=$(count_packages)
          cd /repo
          ./scripts/install.sh ${{ matrix.flags }}
          RC=$?
          AFTER=$(count_packages)
          GUI=$(count_desktop_packages)

          echo "REPLICANT_EXIT=$RC"
          echo "REPLICANT_PKG_DELTA=$((AFTER - BEFORE))"
          echo "REPLICANT_GUI_LEAK=${GUI:-0}"
          CONTAINER

          exit_code=$(grep -oP 'REPLICANT_EXIT=\K\d+' /tmp/installer.log)
          pkg_delta=$(grep -oP 'REPLICANT_PKG_DELTA=\K-?\d+' /tmp/installer.log)
          gui_leak=$(grep -oP 'REPLICANT_GUI_LEAK=\K\d+' /tmp/installer.log)

          echo "::notice::${{ matrix.image }} exit=$exit_code pkg_delta=$pkg_delta gui_leak=$gui_leak"

          if [ "$exit_code" != "${{ matrix.expect_exit }}" ]; then
            echo "::error::expected exit ${{ matrix.expect_exit }}, got $exit_code"
            exit 1
          fi

          # DEF-005 regression guard. The apt path once pulled a GUI terminal
          # emulator and the GTK stack onto a headless host via recommended
          # packages, which --dry-run could never have revealed.
          if [ "$gui_leak" != "0" ]; then
            echo "::error::installer pulled $gui_leak desktop package(s); --no-install-recommends regressed"
            exit 1
          fi

          # DEF-004 regression guard. A refusal must change nothing: the whole
          # point of resolving prerequisites before consenting to sudo.
          if [ "${{ matrix.expect_no_mutation }}" = "true" ] && [ "$pkg_delta" != "0" ]; then
            echo "::error::refusal installed $pkg_delta package(s); it must leave the host untouched"
            exit 1
          fi

  systemd-unit:
    name: systemd unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `systemd-analyze verify` only parses the unit file. It cannot tell you that
      # ProtectHome/ProtectSystem still leave the token writable, that
      # Restart=on-failure recovers the service, that the token stays out of the
      # journal, or that the thing serves at all. Those need systemd to really run
      # it, so this boots a container with systemd as PID 1.
      #
      # Reproduce locally with the same three steps: build the image, run it
      # privileged with the cgroup mount, then exec the install and the script.
      - name: Build a systemd-capable image
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile <<'DOCKERFILE'
          FROM debian:12
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  systemd systemd-sysv python3 python3-venv python3-pip ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          DOCKERFILE
          docker build -t replicant-systemd -f /tmp/Dockerfile /tmp

      - name: Boot systemd and install Replicant
        run: |
          set -euo pipefail
          docker run -d --name rsd --privileged \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
            replicant-systemd /sbin/init
          timeout 120 bash -c \
            'until docker exec rsd systemctl is-system-running --wait 2>/dev/null \
               | grep -qE "running|degraded"; do sleep 2; done'

          # The unit's WorkingDirectory is a repository checkout and the install is
          # editable, because the catalog and the frontend live outside the package.
          tar --exclude=./.git --exclude=./webui/node_modules --exclude=./.venv -cf - . \
            | docker exec -i rsd bash -c 'mkdir -p /opt/replicant && tar -xf - -C /opt/replicant'

          # No npm build here: these assertions are about systemd running the unit,
          # not about the frontend, and every endpoint they touch is served either way.
          docker exec rsd bash -c '
            set -e
            useradd --system --home-dir /opt/replicant --shell /usr/sbin/nologin replicant
            cd /opt/replicant
            python3 -m venv .venv
            ./.venv/bin/pip install -q -e ".[web]"
            chown -R replicant:replicant /opt/replicant'

      - name: Enable the unit and assert on it
        run: |
          set -euo pipefail
          docker exec rsd bash -c '
            set -e
            cp /opt/replicant/scripts/replicant-web.service /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable --now replicant-web'
          sleep 5
          docker exec rsd bash /opt/replicant/scripts/verify-systemd-unit.sh

      - name: Unit journal on failure
        if: failure()
        run: docker exec rsd journalctl -u replicant-web --no-pager -l || true

      - name: Tear down
        if: always()
        run: docker rm -f rsd || true

  wheel:
    name: Wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The frontend must be built BEFORE the wheel, because vite writes into
      # replicant/webui_dist and setuptools packages whatever is there at build
      # time. Building after would produce a wheel with no UI.
      - name: Build the frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist-wheel .

      # Installed into a clean venv and run from a directory with no repository
      # in it. This is the check the unit suite cannot make: every test imports
      # from the source tree, so the suite stayed green for months while a wheel
      # install was unusable.
      - name: Install the wheel and run it away from the repo
        run: |
          set -euo pipefail
          python -m venv /tmp/wheelvenv
          /tmp/wheelvenv/bin/pip install "$(ls dist-wheel/*.whl)[web]"
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere

          /tmp/wheelvenv/bin/replicant --version
          # Count DISTINCT technique ids, not lines matching REP-0: the catalog
          # list gained a transferability-notes footer that repeats a few ids, so
          # a raw line count overcounts (this is the regression that turned this
          # job red on main after the transferability property shipped).
          test "$(/tmp/wheelvenv/bin/replicant list | grep -oE 'REP-[0-9]{3}' | sort -u | wc -l)" -eq 24
          /tmp/wheelvenv/bin/replicant scenario list >/dev/null
          /tmp/wheelvenv/bin/replicant run REP-004 --intensity low --to-file ./out.log --no-send
          head -1 ./out.log | grep -q '^CEF:0|Fortinet|Fortigate'

          # The built UI must be served from the wheel, not the "build it" page.
          /tmp/wheelvenv/bin/replicant web --no-browser --port 9791 >/tmp/web.log 2>&1 &
          python - <<'PY'
          import sys, time, urllib.request
          for _ in range(80):
              try:
                  urllib.request.urlopen("http://127.0.0.1:9791/api/health", timeout=2)
                  break
              except OSError:
                  time.sleep(0.25)
          else:
              sys.exit("web server never answered")
          body = urllib.request.urlopen("http://127.0.0.1:9791/", timeout=5).read().decode()
          if "Frontend build not found" in body:
              sys.exit("wheel served the build-me page: the UI is not in the wheel")
          if "/assets/" not in body:
              sys.exit("served page does not reference the built assets")
          print("wheel serves the built UI")
          PY
          pkill -f "replicant web" || true

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the CLI image
        run: docker build -t replicant:ci .

      # The verification the author cannot run locally (no Docker daemon on the
      # dev Mac): build the image and drive the CLI inside it, from a directory
      # with no repository in it. A broken Dockerfile fails here, which is why
      # this job exists rather than the Dockerfile being merged on inspection.
      - name: Smoke-test the CLI in the image
        run: |
          set -euo pipefail
          docker run --rm replicant:ci --version
          test "$(docker run --rm replicant:ci list | grep -oE 'REP-[0-9]{3}' | sort -u | wc -l)" -eq 24
          docker run --rm replicant:ci scenario list >/dev/null
          # A full run to a file inside the container, read back in the same shell.
          # --entrypoint sh because the image's entrypoint is `replicant`.
          docker run --rm --entrypoint sh replicant:ci -c \
            'replicant run REP-004 --intensity low --to-file /tmp/dns.log --no-send \
             && head -1 /tmp/dns.log' | grep -q '^CEF:0|Fortinet|Fortigate'

      - name: The CLI image does not ship the web UI assets
        run: |
          set -euo pipefail
          # CLI-first: the image excludes webui_dist, so the built assets are absent.
          if docker run --rm --entrypoint sh replicant:ci -c \
               'ls /usr/local/lib/python*/site-packages/replicant/webui_dist/assets/*.js' \
               2>/dev/null; then
            echo "CLI image unexpectedly carries the web UI assets" >&2
            exit 1
          fi
