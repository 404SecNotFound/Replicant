# Replicant Technique Catalog (seed)
# Project: Replicant (github.com/404SecNotFound/Replicant)
# Author: RZA
# Timezone for all timestamps produced at runtime: UTC+04:00 (Dubai)
# Status: 24 techniques. REP-001..011 are the original catalog; REP-012..024
# were added in v0.2.0 and are each anchored to a peer-reviewed detection paper
# with measured results (see docs/technique-catalog-expansion-research*.md).
#
# PURPOSE
# This file is the single source of truth for the interactive TTP menu and the
# headless CLI. The menu is generated from this catalog at runtime. Each entry
# describes one adversary behavior, the FortiGate log type that carries it, the
# CEF fields the scenario engine must vary, realistic value distributions, and
# the class of network detection the behavior is meant to exercise.
#
# SAFETY
# Every value here produces fabricated log text only. No entry causes a real
# connection to any host other than the syslog collector the user configures.
# Default entity pools use RFC1918 and IANA documentation ranges
# (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24). No real malware, no real
# C2 domains, no scanning of real infrastructure.
#
# SCHEMA (per entry)
#   id:               stable Replicant id (REP-###)
#   name:             human label shown in the menu
#   ndr_rule:         generic Replicant label for the class of network
#                     detection this technique exercises. Not tied to any
#                     vendor's or product's rule pack. Map it to whatever
#                     your own detection content calls the equivalent rule.
#   ndr_uc:           stable Replicant use-case id, unique per technique
#   attack:           { tactics: [], techniques: [] }  MITRE ATT&CK
#   fortigate:        { log_type, subtype, signature_id }  log routing and
#                     display; the CEF header signature ID comes from the
#                     vendor profile constants, so signature_id here is
#                     documentation, not a header input
#   cef_fields_held:  fields kept constant to form the pattern
#   cef_fields_varied: fields the scenario engine iterates
#   params:           default_intensity + low/medium/high presets
#   distributions:    guidance the scenario engine uses to look realistic
#   benign_baseline:  what normal looks like, so the signal stands out
#   references:       research anchors (see docs/fortigate-cef-reference.md)
#   safety_notes:     anything an operator must know
#
# INTENSITY MODEL
# Each technique exposes low/medium/high. Intensity scales volume and rate, not
# safety. "high" is still synthetic text to one collector. Duration and rate are
# always operator-overridable from the menu or CLI flags.

version: 0.2.0
vendor_profile: fortigate
timezone: "UTC+04:00"
default_entities_ref: entities.default   # defined in the entity model, not here

techniques:

  - id: REP-001
    name: "Periodic C2 callback (low-and-slow)"
    ndr_rule: "NDR-C2-001"
    ndr_uc: "UC-001"
    objective: >-
      Prove a detection can catch a beacon whose individual sessions each look ordinary, by keying on the regular interval between them rather than on volume.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1071", "T1571"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src", "dst", "dpt", "proto"]
    cef_fields_varied: ["rt", "out", "in", "externalId"]   # externalId = session id
    params:
      low:    { interval_s: 300, jitter_pct: 20, duration_min: 240, out_bytes: [150, 800] }
      medium: { interval_s: 60,  jitter_pct: 15, duration_min: 240, out_bytes: [200, 1500] }
      high:   { interval_s: 30,  jitter_pct: 10, duration_min: 120, out_bytes: [400, 2000] }
    distributions:
      out_bytes: "log-normal, low variance; each callback small"
      in_bytes:  "usually >= out, still small (tasking)"
      interval:  "fixed base +/- jitter_pct, no business-hours weighting"
      dpt_choices: [443, 8443, 8080, 53]
    benign_baseline: "browsing to same dst shows fewer records, far higher out/in and duration"
    references: ["UC-001 Detection Logic", "fortigate-cef-reference: traffic:forward accept"]
    safety_notes: "dst drawn from synthetic-adversary external pool (203.0.113.0/24)"

  - id: REP-002
    name: "Vertical port scan (one host, many ports)"
    ndr_rule: "NDR-RECON-002"
    ndr_uc: "UC-002a"
    objective: >-
      Prove a port-scan rule fires when one source touches many ports on a single host inside a window.
    attack:
      tactics: ["TA0007 Discovery"]
      techniques: ["T1046"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "deny"
    cef_fields_held: ["src", "dst"]
    cef_fields_varied: ["dpt", "act", "rt", "externalId"]
    params:
      low:    { unique_ports: 200,  window_s: 120, gap_ms: [10, 50] }
      medium: { unique_ports: 1000, window_s: 60,  gap_ms: [2, 20] }
      high:   { unique_ports: 4000, window_s: 30,  gap_ms: [1, 5] }
    distributions:
      dpt: "randomized across 1-65535"
      out_bytes: "~0"
      action_mix: "mostly deny, occasional accept on open ports"
    benign_baseline: "normal hosts touch a handful of ports on a given dst"
    references: ["UC-002a", "fortigate-cef-reference: T1046 vertical"]
    safety_notes: "dst is a single synthetic internal or DMZ target"

  - id: REP-003
    name: "Horizontal sweep (one port, many hosts)"
    ndr_rule: "NDR-RECON-002"
    ndr_uc: "UC-002b"
    objective: >-
      Prove a sweep rule fires on one port probed across many hosts, which is the shape a vertical-scan rule misses.
    attack:
      tactics: ["TA0007 Discovery"]
      techniques: ["T1046", "T1018"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "deny"
    cef_fields_held: ["src", "dpt"]
    cef_fields_varied: ["dst", "act", "rt", "externalId"]
    params:
      low:    { unique_hosts: 256,  window_s: 300, port: 445 }
      medium: { unique_hosts: 1024, window_s: 120, port: 3389 }
      high:   { unique_hosts: 4096, window_s: 60,  port: 22 }
    distributions:
      dst: "iterate a /24 to /16 synthetic internal range"
      port_choices: [445, 3389, 22, 23, 80]
    benign_baseline: "normal east-west touches few unique hosts per source per window"
    references: ["UC-002b", "fortigate-cef-reference: T1046 horizontal"]
    safety_notes: "dst pool is synthetic internal space only"

  - id: REP-004
    name: "DNS tunneling / DNS exfil"
    ndr_rule: "NDR-C2-003"
    ndr_uc: "UC-003"
    objective: >-
      Prove a DNS tunnelling rule fires on high unique-label cardinality under one parent domain, rather than on query volume.
    attack:
      tactics: ["TA0011 Command and Control", "TA0010 Exfiltration"]
      techniques: ["T1071.004", "T1048.003"]
    fortigate:
      log_type: "dns"
      subtype: "dns-query"
      signature_id: "54803"    # [Unverified] confirm against live FortiOS build
      action: "pass"
    cef_fields_held: ["src", "dst", "dpt", "proto"]   # dst = resolver, dpt=53
    cef_fields_varied: ["FTNTFGTqname", "FTNTFGTqtype", "rt", "FTNTFGTxid"]
    params:
      low:    { qps: 20,  duration_min: 30, label_len: [30, 45], unique_labels: 300 }
      medium: { qps: 60,  duration_min: 30, label_len: [40, 55], unique_labels: 1200 }
      high:   { qps: 200, duration_min: 15, label_len: [50, 63], unique_labels: 5000 }
    distributions:
      qname: "high-entropy labels (>3.5 bits/char) under one or few parent domains"
      qtype: "weighted toward TXT, NULL, CNAME"
      parent_domain: "synthetic, from docs range (example.net) or a *.invalid parent"
    benign_baseline: "normal resolvers show low unique-label cardinality per parent per hour"
    references: ["UC-003 MPE prereqs", "fortigate-cef-reference: dns:dns-query"]
    safety_notes: "qname parents must be non-resolvable synthetic domains; never real C2"

  - id: REP-005
    name: "Outbound exfil volume anomaly"
    ndr_rule: "NDR-EXFIL-004"
    ndr_uc: "UC-004"
    objective: >-
      Prove an egress-volume rule fires on an out-byte spike measured against that host's own baseline, not a global threshold.
    attack:
      tactics: ["TA0010 Exfiltration"]
      techniques: ["T1041", "T1048"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src", "dst", "dpt"]
    cef_fields_varied: ["out", "in", "rt", "externalId", "FTNTFGTduration"]
    params:
      low:    { total_out_mb: 500,   sessions: 20,  dst_count: 1 }
      medium: { total_out_mb: 2000,  sessions: 40,  dst_count: 2 }
      high:   { total_out_mb: 5000,  sessions: 60,  dst_count: 3 }
    distributions:
      out_bytes: "large; out:in ratio > 20:1"
      dpt_choices: [443, 22, 21]
      timing: "pinned to off-hours (00:00-06:00) to raise anomaly score"
    benign_baseline: "per-host normal out is 1-500 KB in business hours"
    references: ["UC-004 Outliers Nth Percentile", "fortigate-cef-reference: T1041/T1048"]
    safety_notes: "byte counts are integers in the log only; no real data moves"

  - id: REP-006
    name: "Destination fan-out burst"
    ndr_rule: "NDR-RECON-005"
    ndr_uc: "UC-005"
    objective: >-
      Prove a fan-out rule fires when one host suddenly contacts far more distinct destinations than it normally does.
    attack:
      tactics: ["TA0007 Discovery"]
      techniques: ["T1018", "T1046"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src"]
    cef_fields_varied: ["dst", "dpt", "rt", "externalId"]
    params:
      low:    { unique_dst: 50,  window_min: 5 }
      medium: { unique_dst: 150, window_min: 5 }
      high:   { unique_dst: 500, window_min: 5 }
    distributions:
      dst: "mix of synthetic internal and external destinations"
      out_bytes: "small"
    benign_baseline: "normal host contacts < 10 unique dst in a 5 minute window"
    references: ["UC-005", "fortigate-cef-reference: T1018 fan-out"]
    safety_notes: "destination pools are synthetic"

  - id: REP-007
    name: "Brute force and password spray"
    ndr_rule: "NDR-ATO-006"
    ndr_uc: "UC-006"
    objective: >-
      Prove a credential-attack rule separates a spray or brute force from the sparse, self-correcting auth failures every network produces.
    attack:
      tactics: ["TA0006 Credential Access"]
      techniques: ["T1110", "T1110.001", "T1110.003"]
    fortigate:
      log_type: "event"
      subtype: "vpn"
      signature_id: "39426"   # ssl-login-fail
      action: "ssl-login-fail"
    cef_fields_held: ["src"]              # brute: also hold duser
    cef_fields_varied: ["duser", "rt", "FTNTFGTreason"]
    params:
      low:    { mode: "spray", users: 50,   attempts_each: 2, window_min: 30 }
      medium: { mode: "spray", users: 500,  attempts_each: 2, window_min: 30 }
      high:   { mode: "brute", users: 1,    attempts_each: 400, window_min: 8 }
    distributions:
      spray: "many unique duser, few attempts each"
      brute: "one duser, many attempts, optional success at end"
      source_type: "event:vpn ssl-login-fail or event:system login failed (selectable)"
    benign_baseline: "normal auth failures are sparse and self-correct"
    references: ["UC-006 User normalisation prereq", "fortigate-cef-reference: T1110"]
    safety_notes: "usernames drawn from a synthetic directory pool"

  - id: REP-008
    name: "Newly observed external destination per host"
    ndr_rule: "NDR-C2-007"
    ndr_uc: "UC-007"
    objective: >-
      Prove a per-host novelty rule fires on an external destination this particular host has never contacted before.
    attack:
      tactics: ["TA0011 Command and Control", "TA0042 Resource Development"]
      techniques: ["T1071", "T1583"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src"]
    cef_fields_varied: ["dst", "dpt", "rt"]
    params:
      low:    { baseline_days: 7,  novel_dst: 1 }
      medium: { baseline_days: 14, novel_dst: 3 }
      high:   { baseline_days: 30, novel_dst: 5 }
    distributions:
      approach: "engine first emits a baseline of known dst per host, then introduces first-seen external dst"
    benign_baseline: "host talks to a stable set of external destinations"
    references: ["UC-007 Whitelist Profile", "fortigate-cef-reference: T1583"]
    safety_notes: "requires a baseline phase; document the warm-up in the run summary"

  - id: REP-009
    name: "IDS/IPS event-rate spike"
    ndr_rule: "NDR-RECON-008"
    ndr_uc: "UC-008"
    objective: >-
      Prove an IPS rule fires on a rate spike above the low, steady alert baseline a segment normally shows.
    attack:
      tactics: ["TA0043 Reconnaissance", "TA0001 Initial Access"]
      techniques: ["T1595", "T1190"]
    fortigate:
      log_type: "utm"
      subtype: "ips"
      signature_id: "16384"
      action: "reset"
    cef_fields_held: ["dst"]
    cef_fields_varied: ["src", "FTNTFGTattack", "FTNTFGTattackid", "rt", "cnt"]
    params:
      low:    { hits: 20,   window_min: 5 }
      medium: { hits: 200,  window_min: 3 }
      high:   { hits: 1000, window_min: 1 }
    distributions:
      attackid: "one repeated signature (targeted) or many distinct (broad recon), selectable"
      severity: "high or critical (CEF 6-7)"
    benign_baseline: "IPS hit rate is low and steady per segment"
    references: ["UC-008 Signature ID prereq", "fortigate-cef-reference: utm:ips"]
    safety_notes: "attack names are labels only; no exploit is generated"

  - id: REP-010
    name: "Denied outbound connection burst"
    ndr_rule: "NDR-C2-009"
    ndr_uc: "UC-009"
    objective: >-
      Prove a denied-egress rule separates a burst of blocked outbound attempts from the routine policy denials that always exist.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1071", "T1090"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "deny"
    cef_fields_held: ["src"]
    cef_fields_varied: ["dst", "dpt", "rt", "cnt"]
    params:
      low:    { denies: 50,   window_s: 60 }
      medium: { denies: 300,  window_s: 60 }
      high:   { denies: 1000, window_s: 60 }
    distributions:
      dst: "one or many synthetic external destinations"
      pattern: "sharp rate spike, then decay"
    benign_baseline: "occasional denies from policy, not bursts"
    references: ["UC-009", "fortigate-cef-reference: T1090 denied burst"]
    safety_notes: "synthetic destinations only"

  - id: REP-011
    name: "VPN geovelocity anomaly"
    ndr_rule: "NDR-ATO-010"
    ndr_uc: "UC-010"
    objective: >-
      Prove a geovelocity rule fires on two VPN logins too far apart in distance to be reconciled with the time between them.
    attack:
      tactics: ["TA0001 Initial Access"]
      techniques: ["T1078", "T1133"]
    fortigate:
      log_type: "event"
      subtype: "vpn"
      signature_id: "39947"   # ssl-login success  [Unverified] confirm on live build
      action: "tunnel-up"
    cef_fields_held: ["duser"]
    cef_fields_varied: ["src", "FTNTFGTsrccountry", "rt"]
    params:
      low:    { logins: 2, countries: 2, window_min: 60 }
      medium: { logins: 3, countries: 3, window_min: 30 }
      high:   { logins: 4, countries: 4, window_min: 15 }
    distributions:
      geo: "successful logins from geographically distant source blocks implying > 900 km/h"
      country_source: "synthetic GeoIP tags on the external source pool"
    benign_baseline: "a user logs in from a consistent country or approved travel set"
    references: ["UC-010 GeoIP + user normalisation prereq", "fortigate-cef-reference: T1078/T1133"]
    safety_notes: "source IPs and countries are synthetic tags"

  # ---------------------------------------------------------------------------
  # v0.2.0 expansion. Every entry below is anchored to a peer-reviewed paper with
  # measured results; see docs/technique-catalog-expansion-research.md (round 1)
  # and docs/technique-catalog-expansion-research-round2.md (round 2).
  #
  # The benign_baseline field is treated as a correctness requirement here, not a
  # nicety. Bilot et al. (USENIX Security 2025) found eight state-of-the-art
  # provenance IDS not deployment-ready despite near-perfect published results.
  # A technique that emits only the malicious pattern makes any detection score
  # perfectly and teaches the operator nothing.
  # ---------------------------------------------------------------------------

  - id: REP-012
    name: "Jittered and fleet-aggregate C2 callback"
    ndr_rule: "NDR-C2-011"
    ndr_uc: "UC-011"
    objective: >-
      Prove a beacon rule survives jitter and still resolves at fleet aggregate, without firing on the legitimate periodic software that dominates this pattern.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1071"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["dst", "dpt", "proto"]     # src is deliberately NOT held
    cef_fields_varied: ["src", "rt", "out", "in", "externalId"]
    params:
      low:    { mode: "jitter", hosts: 1,  interval_s: 300,  jitter_pct: 50,  duration_min: 240, out_bytes: [200, 1500] }
      medium: { mode: "fleet",  hosts: 12, interval_s: 1800, jitter_pct: 80,  duration_min: 480, out_bytes: [200, 1500] }
      high:   { mode: "fleet",  hosts: 40, interval_s: 3600, jitter_pct: 100, duration_min: 720, out_bytes: [400, 2000] }
    distributions:
      interval: "jitter mode holds one src and widens jitter until per-host periodicity is weak. fleet mode gives each src a rare callback with an offset phase, so the period is only visible in the aggregate across src"
      out_bytes: "log-normal, low variance, same profile as REP-001"
      dpt_choices: [443, 8443]
    benign_baseline: "a benign periodic destination (software update check) is emitted alongside, because both source papers name legitimate periodic software as the dominant false positive"
    emits_foil: true
    references: ["BAYWATCH DSN 2016", "Zhang et al. ACSAC 2023 aggregation-based beaconing detection"]
    safety_notes: "one synthetic external destination from 203.0.113.0/24"

  - id: REP-013
    name: "Self-propagating malware spread (worm-like)"
    ndr_rule: "NDR-LATERAL-012"
    ndr_uc: "UC-012"
    objective: >-
      Prove a lateral-spread rule keys on a growing population of source hosts rather than on east-west SMB traffic, which is normal on its own.
    attack:
      tactics: ["TA0008 Lateral Movement", "TA0007 Discovery"]
      techniques: ["T1210", "T1021.002", "T1046"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"          # mixed with deny
    cef_fields_held: ["dpt"]
    cef_fields_varied: ["src", "dst", "act", "rt", "externalId"]
    params:
      low:    { seed_hosts: 1, generations: 3, fanout: 8,  port: 445,  gen_gap_s: 120 }
      medium: { seed_hosts: 1, generations: 5, fanout: 12, port: 445,  gen_gap_s: 60 }
      high:   { seed_hosts: 2, generations: 6, fanout: 20, port: 3389, gen_gap_s: 30 }
    distributions:
      growth: "each infected source probes fanout targets; a fixed fraction accept and become sources in the next generation, so the count of DISTINCT sources on the port grows geometrically"
      action_mix: "majority deny (target absent or not vulnerable), minority accept (successful spread)"
      port_choices: [445, 3389, 22, 23]
    benign_baseline: "east-west SMB is normal, but from a small stable set of server sources; the signal is a growing source population, not the traffic itself"
    emits_foil: true
    references: ["PORTFILER IEEE CNS 2021"]
    safety_notes: "nothing propagates. The generation count is arithmetic in a loop and every address is synthetic internal space. No code executes"

  - id: REP-014
    name: "Cryptomining pool session"
    ndr_rule: "NDR-IMPACT-013"
    ndr_uc: "UC-013"
    objective: >-
      Prove a mining rule separates a metronomic pool session from a long-lived business session that is bursty in bytes.
    attack:
      tactics: ["TA0040 Impact"]
      techniques: ["T1496"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src", "dst", "dpt", "proto"]
    cef_fields_varied: ["rt", "out", "in", "FTNTFGTduration", "externalId"]
    params:
      low:    { sessions: 1, session_min: 120, share_interval_s: 60, dpt: 3333 }
      medium: { sessions: 3, session_min: 480, share_interval_s: 30, dpt: 14444 }
      high:   { sessions: 6, session_min: 720, share_interval_s: 10, dpt: 443 }
    distributions:
      duration: "single sessions lasting hours, far above the per-host session duration norm"
      byte_ratio: "in:out close to 1:1, both small and steady. No large transfer at any point, which is what separates it from exfiltration"
      dpt_choices: [3333, 4444, 5555, 7777, 14444, 443]
    benign_baseline: "a long-lived business session is emitted alongside, bursty in bytes rather than metronomic. MineShark had to auto-filter over 99.3% of false alarms, which is why this baseline is required"
    emits_foil: true
    references: ["MineShark NDSS 2025", "MineHunter ACSAC 2021", "CJ-Sniffer RAID 2022"]
    safety_notes: "pool destinations are synthetic documentation-range IPs. Never substitute a real mining pool hostname or address, even as a label"

  - id: REP-015
    name: "Low-throughput DNS exfiltration"
    ndr_rule: "NDR-EXFIL-014"
    ndr_uc: "UC-014"
    objective: >-
      Prove a DNS exfiltration rule still fires when the query rate is entirely normal, so cardinality is the only thing left to key on.
    attack:
      tactics: ["TA0010 Exfiltration", "TA0011 Command and Control"]
      techniques: ["T1048.003", "T1071.004"]
    fortigate:
      log_type: "dns"
      subtype: "dns-query"
      signature_id: "54803"    # [Unverified] same caveat as REP-004
      action: "pass"
    cef_fields_held: ["src", "dst", "dpt", "proto"]
    cef_fields_varied: ["FTNTFGTqname", "FTNTFGTqtype", "rt", "FTNTFGTxid"]
    params:
      low:    { qph: 2,  duration_h: 72, label_len: [12, 20], unique_labels: 144 }
      medium: { qph: 6,  duration_h: 48, label_len: [16, 28], unique_labels: 288 }
      high:   { qph: 20, duration_h: 24, label_len: [20, 34], unique_labels: 480 }
    distributions:
      rate: "queries per HOUR, not per second. Deliberately below the tunnel-rate thresholds REP-004 trips"
      qname: "shorter, lower-entropy labels than REP-004, consistent with encoded record fields rather than a file transfer"
      qtype: "weighted to A and AAAA rather than TXT, because the query itself is the channel"
      parent_domain: "one synthetic parent, stable for the whole run"
    benign_baseline: "a benign parent with a comparable total query count but low unique-label cardinality, so query rate alone cannot separate them"
    emits_foil: true
    references: ["Nadler, Aminov, Shabtai, Computers & Security 80 (2019) 36-53"]
    safety_notes: "parents stay non-resolvable synthetic. Runs are long (up to 72h of simulated time); the duration is stated in the run summary"

  - id: REP-016
    name: "DGA NXDOMAIN cluster"
    ndr_rule: "NDR-C2-015"
    ndr_uc: "UC-015"
    objective: >-
      Prove a DGA rule keys on clustered NXDOMAIN responses and is not defeated by the steady benign NXDOMAIN trickle from typos and stale records.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1568.002", "T1071.004"]
    fortigate:
      log_type: "dns"
      subtype: "dns-response"
      signature_id: "54802"    # confirmed (fortigate-cef-reference s2.4)
      action: "pass"
    cef_fields_held: ["src", "dst", "dpt"]
    cef_fields_varied: ["FTNTFGTqname", "FTNTFGTrcode", "rt", "FTNTFGTxid"]
    params:
      low:    { domains_per_epoch: 50,  epochs: 4, label_len: [8, 12], nx_ratio: 0.95 }
      medium: { domains_per_epoch: 200, epochs: 6, label_len: [7, 16], nx_ratio: 0.97 }
      high:   { domains_per_epoch: 800, epochs: 8, label_len: [6, 20], nx_ratio: 0.99 }
    distributions:
      qname: "many DISTINCT second-level labels with an algorithmic character distribution. This is the inverse of REP-004, which puts many subdomains under one parent"
      rcode: "NXDOMAIN for nx_ratio of responses; NOERROR for the small remainder, representing the one registered rendezvous domain the operator actually stood up"
      epochs: "the domain set regenerates each epoch, mirroring a time-seeded generator"
    benign_baseline: "normal hosts produce a low steady NXDOMAIN rate from typos and stale records. A benign NXDOMAIN trickle is emitted so the detection cannot simply threshold on any NXDOMAIN at all"
    emits_foil: true
    references: ["Pleiades USENIX Security 2012", "Woodbridge et al. 2016 arXiv:1611.00791"]
    safety_notes: "every generated label sits under the reserved .invalid TLD, so no generated name can resolve even by accident. This must not be relaxed to a realistic-looking TLD: the technique generates thousands of unseen domain strings and non-resolvability is what makes that safe"

  - id: REP-017
    name: "Encrypted DNS (DoH) policy bypass"
    ndr_rule: "NDR-C2-016"
    ndr_uc: "UC-016"
    objective: >-
      Prove a rule can notice an absence: a host's resolver traffic stopping when it switches to encrypted DNS, which most rules never look for.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1572", "T1071.004"]
    fortigate:
      log_type: "traffic"      # emits a dns:dns-query baseline phase too
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src", "dpt", "proto"]
    cef_fields_varied: ["dst", "rt", "out", "in", "externalId"]
    params:
      low:    { baseline_min: 120, switch_at_min: 60, doh_sessions: 20,  resolvers: 1 }
      medium: { baseline_min: 240, switch_at_min: 90, doh_sessions: 80,  resolvers: 2 }
      high:   { baseline_min: 240, switch_at_min: 60, doh_sessions: 200, resolvers: 3 }
    distributions:
      phase_1: "normal dns:dns-query volume from the host to the internal resolver on 53"
      phase_2: "resolver queries stop entirely; repeated small TLS sessions to synthetic DoH resolver addresses on 443 begin"
      byte_profile: "small request, small response, high session count, consistent with query-response carried over HTTPS"
    benign_baseline: "the pre-switch phase IS the baseline. The detection has to notice an absence, which is the failure mode this technique exists to expose"
    references: ["CIRA-CIC-DoHBrw-2020 corpus and derived detection literature"]
    safety_notes: "DoH resolver addresses MUST stay synthetic (203.0.113.0/24). Never use the real public resolver addresses the source corpus was built on, even as labels"

  - id: REP-018
    name: "Lateral movement login chain"
    ndr_rule: "NDR-LATERAL-017"
    ndr_uc: "UC-017"
    objective: >-
      Prove a lateral-movement rule separates a host-to-host login chain from an admin star pattern carrying the same number of logins.
    attack:
      # Both tactics are carried by the listed techniques, which is the rule
      # this catalog follows: T1021 is Lateral Movement, and T1078 and T1550
      # are both Defense Evasion as well. TA0006 Credential Access was listed
      # here until v0.7.0 and is supported by none of the three; dropping it
      # left TA0008 alone, which was defensible but discarded the evasion half
      # of what the chain demonstrates. Using valid accounts and alternate
      # authentication material to move laterally IS the evasion.
      tactics: ["TA0008 Lateral Movement", "TA0005 Defense Evasion"]
      techniques: ["T1021", "T1078", "T1550"]
    fortigate:
      log_type: "event"
      subtype: "vpn"           # plus event:system login records and traffic:forward east-west legs
      signature_id: "39947"    # [Unverified] same caveat as REP-011
      action: "tunnel-up"
    cef_fields_held: []
    cef_fields_varied: ["duser", "src", "dst", "rt"]
    params:
      low:    { path_len: 3, users: 2, switch_at_hop: 2, window_min: 60 }
      medium: { path_len: 5, users: 3, switch_at_hop: 3, window_min: 45 }
      high:   { path_len: 7, users: 4, switch_at_hop: 2, window_min: 30 }
    distributions:
      path: "a login into hop 1, then each hop becomes the source of the login into the next. Strictly ordered, never overlapping"
      user_switch: "duser changes at switch_at_hop, modelling credential theft partway along the path (the causal-user change Hopper keys on)"
      timing: "hops separated by minutes within window_min"
    benign_baseline: "an admin star pattern is emitted alongside: one workstation logging into several hosts. The star emits path_len-1 logins against the chain's path_len total records (a tunnel-up plus one login per subsequent hop); the shapes, not the counts, are what separate them. Separating star from chain is the detection"
    emits_foil: true
    references: ["Hopper, USENIX Security 2021", "LMDetect 2024", "Euler NDSS 2022"]
    safety_notes: "usernames from the synthetic directory pool, same as REP-007. No authentication is attempted against anything"

  - id: REP-019
    name: "Stealth scan below rate threshold"
    ndr_rule: "NDR-RECON-018"
    ndr_uc: "UC-018"
    objective: >-
      Prove a scan rule still fires below its rate threshold, which needs long-window aggregation across the whole source pool.
    attack:
      tactics: ["TA0007 Discovery", "TA0043 Reconnaissance"]
      techniques: ["T1046", "T1595.001"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "deny"
    cef_fields_held: []
    cef_fields_varied: ["src", "dst", "dpt", "rt", "externalId"]
    params:
      low:    { probes_per_dst: 1, gap_s: [300, 900], src_pool: 4,  total_probes: 200,  order: "random" }
      medium: { probes_per_dst: 1, gap_s: [120, 600], src_pool: 8,  total_probes: 600,  order: "random" }
      high:   { probes_per_dst: 2, gap_s: [60, 300],  src_pool: 16, total_probes: 1500, order: "random" }
    distributions:
      gap: "minutes between probes, so no rate window accumulates enough events to trip a threshold"
      src_rotation: "probes spread across src_pool to keep per-source counts under per-source thresholds"
      order: "randomized destination and port order, defeating sequential-sweep signatures"
    benign_baseline: "sparse policy denies look nearly identical. Separating them needs long-window aggregation across the whole source pool, which is exactly what TRW-style detectors do not do by default"
    emits_foil: true
    references: ["Jung et al., Fast Portscan Detection Using Sequential Hypothesis Testing, IEEE S&P 2004"]
    safety_notes: "synthetic targets only. Long by design; the span is stated in the run summary"

  - id: REP-020
    name: "First contact with a newly registered domain"
    ndr_rule: "NDR-C2-019"
    ndr_uc: "UC-019"
    objective: >-
      Prove an organisation-wide novelty rule fires on first contact with a newly registered domain, which per-host novelty (REP-008) cannot see.
    attack:
      tactics: ["TA0011 Command and Control", "TA0042 Resource Development"]
      techniques: ["T1583.001", "T1071"]
    fortigate:
      log_type: "dns"
      subtype: "dns-query"
      signature_id: "54803"    # [Unverified]
      action: "pass"
    cef_fields_held: ["dst", "dpt"]
    cef_fields_varied: ["src", "FTNTFGTqname", "rt", "FTNTFGTxid"]
    params:
      low:    { baseline_domains: 200, novel_domains: 1, hosts: 1, window_min: 60 }
      medium: { baseline_domains: 500, novel_domains: 3, hosts: 3, window_min: 30 }
      high:   { baseline_domains: 800, novel_domains: 8, hosts: 8, window_min: 15 }
    distributions:
      baseline: "a stable set of synthetic domains, each queried once by one host, establishing organizational normal"
      novel: "domains never queried before by any host, low query count, contacted by few hosts"
    benign_baseline: "the baseline_domains phase IS the baseline. Novelty is organization-wide, unlike REP-008 which is novel per host"
    references: ["PREDATOR, Hao et al., CCS 2016"]
    safety_notes: "novel domains use reserved TLDs. Replicant performs no registration and no WHOIS lookup, and resolves nothing"

  - id: REP-021
    name: "Inbound perimeter scan reception"
    ndr_rule: "NDR-RECON-020"
    ndr_uc: "UC-020"
    objective: >-
      Supply a realistic inbound perimeter scan as a false-positive source, to prove outbound scan rules do not fire on traffic arriving from the internet.
    attack:
      tactics: ["TA0043 Reconnaissance"]
      techniques: ["T1595.001", "T1595.002"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "deny"
    cef_fields_held: ["dst"]              # the perimeter address
    cef_fields_varied: ["src", "dpt", "rt", "externalId"]
    params:
      low:    { unique_src: 120, duration_min: 60, campaigns: 2, aggressive_probes: 40 }
      medium: { unique_src: 300, duration_min: 60, campaigns: 5, aggressive_probes: 120 }
      high:   { unique_src: 450, duration_min: 30, campaigns: 9, aggressive_probes: 300 }
    distributions:
      src: "many distinct external sources, heavy-tailed: a few campaign sources send aggressive_probes each, a long tail sends one or two probes"
      pattern: "steady low-rate background plus short aggressive campaigns overlaid, the two populations the IMC study separates"
      direction: "INBOUND. The interface pair is reversed relative to every other traffic technique"
      port_choices: [22, 23, 80, 443, 445, 1433, 3306, 3389, 5900, 8080]
    benign_baseline: "this technique largely IS the baseline of a real perimeter. Its value is as a false-positive source for outbound scan rules, so it is designed to be run alongside REP-002 and REP-003"
    references: ["Have you SYN me? Characterizing Ten Years of Internet Scanning, IMC 2024"]
    safety_notes: "source cardinality is capped by the size of the IANA documentation ranges, which is a safety constraint and not a tuning limit. The source study observed 465,251 unique scanners; the ceiling here is 500 usable addresses and the presets stay under it. No real scanner infrastructure is named"

  - id: REP-022
    name: "Multi-stage IDS alert chain (kill-chain ordered)"
    ndr_rule: "NDR-CORR-021"
    ndr_uc: "UC-021"
    objective: >-
      Prove a correlation rule keys on the kill-chain order of alerts rather than on how many arrived in a window.
    attack:
      tactics: ["TA0043 Reconnaissance", "TA0001 Initial Access", "TA0011 Command and Control"]
      techniques: ["T1595", "T1190", "T1071"]
    fortigate:
      log_type: "utm"
      subtype: "ips"
      signature_id: "16384"
      action: "reset"
    cef_fields_held: ["src", "dst"]       # the entity pair the chain is about
    cef_fields_varied: ["FTNTFGTattack", "FTNTFGTattackid", "rt", "act", "FTNTFGTseverity"]
    params:
      low:    { stages: 3, hits_per_stage: [2, 5],  stage_gap_s: [120, 600], noise_alerts: 20 }
      medium: { stages: 4, hits_per_stage: [3, 12], stage_gap_s: [60, 300],  noise_alerts: 120 }
      high:   { stages: 5, hits_per_stage: [5, 25], stage_gap_s: [30, 180],  noise_alerts: 500 }
    distributions:
      stage_order: "recon, then exploit attempt, then post-exploitation or C2. Strictly ordered in time and never interleaved out of order, which is what a correlation rule keys on"
      severity: "ascending across stages, so a severity-weighted rule sees escalation"
      noise_alerts: "unrelated single alerts on other entity pairs, interleaved through the whole window"
    benign_baseline: "noise_alerts IS the baseline. A rule that fires on any N alerts in a window fires on the noise too. AACT reported 61% of real SOC alerts were closable, so a clean chain would badly overstate a rule's quality"
    emits_foil: true
    references: ["Wilkens et al., Multi-Stage Attack Detection via Kill Chain State Machines", "ALERTPRO Computers & Security 2023", "AACT Turcotte et al. 2025"]
    safety_notes: "attack names and signature ids are labels only, identical to REP-009. No exploit text and no payloads are ever emitted"

  - id: REP-023
    name: "TLS 1.3 C2 with flow-only signal"
    ndr_rule: "NDR-C2-022"
    ndr_uc: "UC-022"
    objective: >-
      Prove a C2 rule works on flow features alone, when TLS 1.3 leaves no payload or certificate detail to inspect.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1071.001", "T1573.002"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: ["src", "dst", "dpt", "proto"]      # dpt always 443
    cef_fields_varied: ["rt", "out", "in", "externalId", "FTNTFGTduration"]
    params:
      low:    { sessions: 40,  interval_s: 180, out_bytes: [900, 1400],  in_bytes: [400, 900] }
      medium: { sessions: 120, interval_s: 90,  out_bytes: [1100, 1600], in_bytes: [500, 1100] }
      high:   { sessions: 300, interval_s: 45,  out_bytes: [1200, 1800], in_bytes: [600, 1300] }
    distributions:
      dpt: "always 443, indistinguishable from browsing on port alone"
      byte_profile: "the distinguishing feature is LOW variance, not high volume. Browsing to 443 has wildly variable transfer sizes; this does not"
      duration: "short and consistent per session, unlike a browsing session that holds open"
      handshake: "no handshake-derived field is emitted at all. A detection that needs JA3 or a cipher suite gets nothing, which is the point of the technique"
    benign_baseline: "concurrent browsing to 443 to other destinations with high byte variance and varied durations, so neither port nor destination count can separate them"
    emits_foil: true
    references: ["Extending C2 Traffic Detection Methodologies: From TLS 1.2 to TLS 1.3-enabled Malware, RAID 2024"]
    safety_notes: "one synthetic external destination. Replicant negotiates no TLS for this technique; the --transport tls option is a separate concern (it encrypts the syslog channel to the collector)"

  - id: REP-024
    name: "Internal host as proxy relay node"
    ndr_rule: "NDR-C2-023"
    ndr_uc: "UC-023"
    objective: >-
      Prove a relay rule distinguishes an unsanctioned internal proxy from a sanctioned one behaving identically, where asset role is the only difference.
    attack:
      tactics: ["TA0011 Command and Control"]
      techniques: ["T1090", "T1090.001"]
    fortigate:
      log_type: "traffic"
      subtype: "forward"
      signature_id: "00013"
      action: "accept"
    cef_fields_held: []                   # the relay host appears as dst inbound and src outbound
    cef_fields_varied: ["src", "dst", "dpt", "rt", "out", "in", "externalId"]
    params:
      low:    { relay_pairs: 30,  lag_ms: [20, 200],  duration_min: 60, clients: 5 }
      medium: { relay_pairs: 150, lag_ms: [10, 500],  duration_min: 60, clients: 25 }
      high:   { relay_pairs: 600, lag_ms: [5, 1500],  duration_min: 30, clients: 80 }
    distributions:
      pairing: "each relayed request is an inbound session to the relay host followed within lag_ms by an outbound session from that host, with correlated byte volumes"
      byte_correlation: "outbound out_bytes approximately equals inbound out_bytes (and in to in), because the host is forwarding rather than originating"
      lag: "jittered, and wide at the high preset, per the adversarially-robust framing of the source paper (naive fixed-window timing correlation is evadable)"
    benign_baseline: "a sanctioned proxy host doing the same thing is emitted alongside. The pattern is identical; only the asset role differs. This technique tests whether a detection uses role or only pattern"
    emits_foil: true
    references: ["Beyond RTT: An Adversarially Robust Two-Tiered Approach for Residential Proxy Detection, NDSS"]
    safety_notes: "Replicant relays nothing. Both halves of every pair are fabricated records. The only socket opened is to the operator's collector"

# NOTES
# 1. Signature IDs marked [Unverified] must be confirmed against a live FortiOS
#    build before the pack is customer-facing. The CEF reference file records
#    which are verified (traffic 00013, IPS 16384, DNS response 54802,
#    SSL-VPN login fail 39426, admin login failed 32002, user auth 43008).
# 2. Byte-field key is configurable per profile. Default out/in. Some FortiOS
#    builds emit FTNTFGTsentbyte/FTNTFGTrcvdbyte. Keep this switchable.
# 3. Device Product string is "Fortigate" (lower-case g) to match real output.
# 4. Techniques that need a warm-up baseline (REP-008) must state the warm-up in
#    the run summary so the analyst knows when the anomaly begins.
