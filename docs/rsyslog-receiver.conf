# Minimal Replicant Tier 1 receiver example.
#
# Change the port and output path for the lab. This listens on loopback only,
# writes the full syslog frame, and intentionally adds no parsing or forwarding.
# It is an operator-run alternative to the built-in loopback receiver, not a
# second product surface.
module(load="imudp")
input(type="imudp" address="127.0.0.1" port="5514" ruleset="replicant_validation")

ruleset(name="replicant_validation") {
  action(type="omfile" file="/tmp/replicant-validation.log" template="RSYSLOG_SyslogProtocol23Format")
  stop
}
